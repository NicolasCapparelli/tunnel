[package]
name = "tunnel"
version = "0.1.0"
description = "A private passage between your devices"
edition = "2021"

[[bin]]
name = "tunnel-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
chacha20poly1305 = "0.10"
hex = "0.4"
base64 = "0.22"
rfd = "0.17"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
local-ip-address = "0.6"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"
clipboard-win = "5"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
